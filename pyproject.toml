[project]
name = "brms"
version = "0.2.0"
description = "A bank risk management simulation framework."
readme = "README.md"
authors = [{ name = "Mingze Gao", email = "adrian.gao@outlook.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.2.3",
  "quantlib>=1.36",
]

[project.optional-dependencies]
gui = [
  "matplotlib>=3.10.0",
  "pyside6==6.8.1",
  "qtawesome>=1.3.1",
  "rich>=13.9.4",
  "tabulate>=0.9.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
brms = "brms.main:main"
brms-web = "brms.web.__main__:main"

[project.urls]
Homepage = "https://bankrisk.org"

[dependency-groups]
dev = [
  "brms[gui]",
  "brms[web]",
  "httpx>=0.27",
  "hatchling",
  "isort>=5.13.2",
  "mike>=2.1.3",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-git-revision-date-localized-plugin>=1.3.0",
  "mkdocs-literate-nav>=0.6.1",
  "mkdocs-material>=9.6.1",
  "mkdocstrings-python>=1.13.0",
  "pytest>=8.3.4",
  "ruff>=0.8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brms"]

[tool.hatch.build]
include = [
  "src/brms/resources/fonts/*.ttf",
  "src/brms/resources/fonts/OFL.txt",
]
# The simulation zips are generated by src/brms/data/create_*.py and gitignored,
# so they must be force-included as artifacts.
artifacts = ["src/brms/data/*.zip"]
# The raw market data (src/brms/data/market) ships too: building a bank from a bank file or a
# Call Report reads it (brms.lab.bank_file.default_market_frames).

[tool.hatch.build.hooks.custom]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]

[tool.pytest.ini_options]
filterwarnings = [
  # QuantLib
  'ignore:builtin type SwigPyPacked has no __module__ attribute',
  'ignore:builtin type SwigPyObject has no __module__ attribute',
  'ignore:builtin type swigvarlink has no __module__ attribute',
]

[tool.pylint]
extension-pkg-whitelist = ["PySide6"]
